name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
      - name: Permit sandbox user namespaces on Ubuntu runners
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/loom-sandbox.apparmor <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile loom-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          profile loom-seccomp /**/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/*/apply-seccomp flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /tmp/loom-sandbox.apparmor
      - run: pnpm run check
      - run: pnpm run check:package
